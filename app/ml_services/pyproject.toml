[build-system]
requires = ["setuptools>=75.8,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-complaint-intelligence"
version = "0.1.0"
description = "Customer complaint intelligence ML service"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.115.12",
  "google-genai>=2.24.0,<3.0.0",
  "numpy>=1.26.0,<3.0.0",
  "pandas>=2.2.0,<4.0.0",
  "pydantic>=2.11,<4.0",
  "pydantic-settings==2.8.1",
  "PyYAML==6.0.2",
  "scikit-learn>=1.5.0,<2.0.0",
  "uvicorn[standard]==0.34.0",
]
[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.15.0",
  "pandas-stubs>=2.2.0",
  "pytest==8.3.5",
  "ruff==0.11.0",
  "types-PyYAML>=6.0.12",
]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["I001"]
"scripts/*" = ["E402", "I001"]
[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
disallow_any_generics = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*"]
ignore_missing_imports = true

