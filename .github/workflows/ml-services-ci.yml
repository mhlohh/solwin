name: ML service CI

on:
  pull_request:
    paths:
      - "app/ml_services/**"
  push:
    branches: [dev]
    paths:
      - "app/ml_services/**"

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/ml_services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag customer-complaint-intelligence:ci app/ml_services
