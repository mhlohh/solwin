name: ML service CI

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "config/**"
      - "pyproject.toml"
      - "Dockerfile"
      - ".github/workflows/ml-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "config/**"
      - "pyproject.toml"
      - "Dockerfile"

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: pytest

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag customer-complaint-intelligence:ci .
