[build-system]
requires = ["setuptools>=75.8,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-complaint-intelligence"
version = "0.1.0"
description = "Modular ML intelligence service for customer complaints"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.115.12",
  "pydantic==2.10.6",
  "pydantic-settings==2.8.1",
  "PyYAML==6.0.2",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.15.0",
  "pytest==8.3.5",
  "ruff==0.11.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
